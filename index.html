<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <link rel="manifest" href="manifest.webmanifest">
  <title>MSI le baz</title>
  <style>
    :root{--bg:#050a14;--card:#0d1728;--gold:#f4b41a;--text:#ffffff;}
    body{background-color:var(--bg);color:var(--text);font-family:sans-serif;margin:0;padding:16px;display:flex;flex-direction:column;align-items:center;}
    header{width:100%;text-align:center;padding:10px 0;font-size:1.5rem;font-weight:bold;}
    header span{color:var(--gold);}
    main{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;align-items:center;}
    .hero img.poster{width:100%;border-radius:12px;object-fit:cover;}
    .intro{text-align:center;}
    audio{width:100%;margin-top:10px;}
    .install{display:none;width:100%;text-align:center;background:var(--card);padding:12px;border-radius:8px;}
    button{background:var(--gold);color:#000;border:none;padding:10px 20px;font-weight:bold;border-radius:6px;cursor:pointer;margin-top:8px;}
    footer{margin-top:30px;font-size:0.8rem;text-align:center;color:#888;}
  </style>
</head>
<body>
  <header><div class="brand">MSI <span>LE BAZ</span></div></header>
  <main>
    <section class="hero">
      <img class="poster" src="msi-le-baz.jpg" alt="Pochette MSI le baz">
    </section>
    
    <section class="intro">
      <h1>MSI le baz</h1>
      <p>Bienvenue sur mon application musicale officielle.</p>
      <!-- Lecteur audio corrigé avec preload pour éviter le bug 0:00 -->
      <audio controls preload="metadata" src="piste.mp3"></audio>
    </section>

    <div id="installBox" class="install">
      <p><strong>Installer l'application</strong></p>
      <button id="installBtn">Installer</button>
    </div>

    <section class="section" id="musique">
      <h2>🎵 Actualités</h2>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; MSI le baz - Tous droits réservés</p>
  </footer>

  <script>
    let deferredPrompt;
    const installBox = document.getElementById('installBox');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBox.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBox.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker enregistré avec succès !"))
        .catch((err) => console.log("Erreur Service Worker :", err));
    }
  </script>
</body>
  </html>
